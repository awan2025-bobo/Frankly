<!doctype html>
<html><head><meta charset="utf-8"><title>Frankly logo</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&display=block" rel="stylesheet">
<!-- Same paths as src/components/Logo.tsx. ?v=square (beige) | clear (transparent) | lockup (logo + wordmark) -->
<style>
  html,body{margin:0}
  .wrap{display:flex;align-items:center;justify-content:center}
  .word{font-family:'Fraunces',serif;font-weight:700;font-size:150px;color:#4B5538;letter-spacing:-1px;line-height:1}
</style></head>
<body>
<div id="root" class="wrap"></div>
<script>
  const v = new URLSearchParams(location.search).get('v') || 'square';
  const fills = `
    <path d="M24 45C13 45 5.5 38.5 6 29c.3-5.5 3.2-9.6 7.4-12.2-1.4 6.4-.4 13.4 4.6 19.4L24 45z"/>
    <path d="M24 45c11 0 18.5-6.5 18-16-.3-5.5-3.2-9.6-7.4-12.2 1.4 6.4.4 13.4-4.6 19.4L24 45z"/>
    <path d="M24 42.5c-6.6-2.4-10.2-8.2-9.8-15 .4-6.8 4.6-10.6 7.4-15.4 1.2-2.1 1.8-4.6 1.6-7.6 3.4 2.4 5.6 5.8 6 9.6 2.6 3 4.6 6.8 4.6 12.8 0 7-3.4 13.2-9.8 15.6z"/>`;
  // Seams between leaves, leaf veins and the smiley are cut out of the shape (a mask), so the
  // transparent version is truly see-through there.
  const cuts = `
    <path d="M24 42.5c-6.6-2.4-10.2-8.2-9.8-15 .4-6.8 4.6-10.6 7.4-15.4 1.2-2.1 1.8-4.6 1.6-7.6 3.4 2.4 5.6 5.8 6 9.6 2.6 3 4.6 6.8 4.6 12.8 0 7-3.4 13.2-9.8 15.6z" fill="none" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M10.2 30.5c1.6 4.6 4.8 8 9.4 10.2" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M37.8 30.5c-1.6 4.6-4.8 8-9.4 10.2" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="21.4" cy="28.6" r="1.45" fill="#000"/><circle cx="26.6" cy="28.6" r="1.45" fill="#000"/>
    <path d="M21.6 32.2c1.4 1.6 3.4 1.6 4.8 0" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>`;
  const svg = `<svg viewBox="0 0 48 48" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs><mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
      <rect width="48" height="48" fill="#fff"/>${cuts}</mask></defs>
    <g fill="#4B5538" mask="url(#m)">${fills}</g></svg>`;
  const root = document.getElementById('root');
  document.body.style.background = v === 'clear' ? 'transparent' : '#EEE8DC';
  if (v === 'lockup') {
    root.style.cssText = 'width:1200px;height:400px;gap:28px';
    root.innerHTML = `<div style="width:200px;height:200px">${svg}</div><div class="word">Frankly</div>`;
  } else {
    root.style.cssText = 'width:512px;height:512px';
    root.innerHTML = `<div style="width:400px;height:400px">${svg}</div>`;
  }
</script>
</body></html>
